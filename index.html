<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ShowUp</title>
    <meta name="theme-color" content="#FAF7F1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShowUp" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html { -webkit-text-size-adjust: 100%; min-height: -webkit-fill-available; }
      html, body, #root { margin: 0; padding: 0; height: 100%; height: 100dvh; background: #FAF7F1; overscroll-behavior: none; }
      body { overflow: hidden; width: 100%; }
      * { -webkit-tap-highlight-color: transparent; }
      button, input, a, [role="button"] { touch-action: manipulation; }
      input, select, textarea { font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iOS standalone caches a stale viewport height per home-screen icon;
      // measure the real one and let the app size itself from it.
      const setH = () => document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
      setH();
      window.addEventListener("resize", setH);
      window.addEventListener("orientationchange", () => setTimeout(setH, 250));
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
