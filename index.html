<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ShowUp</title>
    <meta name="theme-color" content="#17130E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShowUp" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html { -webkit-text-size-adjust: 100%; }
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #17130E; overscroll-behavior: none; }
      body { position: fixed; inset: 0; width: 100%; }
      * { -webkit-tap-highlight-color: transparent; }
      button, input, a, [role="button"] { touch-action: manipulation; }
      input, select, textarea { font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
